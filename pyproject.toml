[project]
name = "explainable-bike-demand"
version = "0.1.0"
description = "Explainable hourly bike-sharing demand forecasts with LightGBM and SHAP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.5",
    "shap>=0.46",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["ipykernel", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_demand"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
